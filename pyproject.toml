[project]
name = "autonomous-scraping"
version = "0.1.0"
description = "Companion code for Autonomous Scraping: The JSON-Config Approach"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.44",
    "flask>=3.0",
    "jinja2>=3.1",
    "openai>=1.35",
    "mcp>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "RestrictedPython>=7.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "ipywidgets>=8.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx[cli]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
