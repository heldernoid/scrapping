<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">ShopSphere</a>
      <nav class="site-nav">
        <a href="/">All Products</a>
      </nav>
      <div class="header-badge">CSR</div>
    </div>
  </header>

  <main class="container">
    <!--
      CSR DEMO: This is the ONLY HTML the server sends.
      All product content below is injected by JavaScript after page load.
      BeautifulSoup on this raw HTML sees nothing but this empty shell.
      Playwright executes the JS and renders the real content.
    -->
    <div id="app">
      <div class="loading">Loading products</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ShopSphere CSR Demo - Content rendered client-side via JavaScript. View source to confirm the HTML is empty.</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
